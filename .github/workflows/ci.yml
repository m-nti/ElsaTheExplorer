name: CI

on:
  # The umbrella branch carries the build; PRs into it must be gated too, not only
  # PRs into main. Without this, every feature PR reported "no checks".
  pull_request:
    branches: [main, design/explorer-foundation]
  push:
    branches: [main, design/explorer-foundation]
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Newest major, matching .nvmrc and package.json engines. Node 26
          # ships npm 11, the version that generates package-lock.json; npm 10
          # rejects this lock's alias/optional platform packages.
          node-version: 26
          cache: npm

      # Fail closed: no `--if-present`, no `|| true`. A gate declared in
      # .github/gates.json must have a script and a step here; a gate that
      # cannot exist yet is declared pending with its issue and printed.
      - name: Install
        run: npm ci

      - name: Gate manifest
        run: npm run ci:gates

      - name: Scaffold presence
        run: |
          missing=""
          for f in index.html src/main.ts vite.config.ts panda.config.ts; do
            [ -e "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::scaffold incomplete — missing:$missing"
            exit 1
          fi

      # Gate order follows ADR-0006: vocabulary first, then typecheck, then
      # styling/lint/dead code, then tests, then the build.
      - name: Canon / vocabulary gate
        run: npm run canon

      - name: Canon gate self-tests
        run: npm run test:canon

      # Documents are read, not compiled: a table row whose field count drifts
      # from its header renders as a phantom column with no other symptom
      # (issue #29, eleven rows). Rectangularity is asserted, not reviewed.
      - name: Markdown table integrity
        run: npm run gate:tables

      # An internal link or a backticked path that no longer resolves is invisible
      # to every other gate: `canon` reads the words, `gate:tables` reads the rows.
      # Issue #61: a moved file left three README links pointing at nothing.
      - name: Internal paths (links and backticked repo paths)
        run: npm run check:paths

      # A plan that calls a merged PR "in review" tells the reader to wait for
      # work that is done. Degrades to a warning without `gh` or a token, so this
      # step can never be the reason a tokenless CI run is red.
      - name: Plan status vs. merged PRs
        run: npm run gate:plan-status

      - name: Typecheck (tsc)
        run: npm run check:ts

      - name: Typecheck (svelte-check --tsgo)
        run: npm run check

      - name: Stylelint
        run: npm run stylelint

      - name: Cross-file selector diff
        run: npm run gate:selectors

      - name: Unused CSS (Svelte compiler)
        run: npm run gate:unused-css

      - name: Lint (ESLint)
        run: npm run lint

      - name: Dead code (knip)
        run: npm run knip

      - name: Duplicate code (jscpd, pinned)
        run: npm run jscpd

      - name: Unit tests + contrast gate + coverage ratchet (Vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

  # One job closes the class of Windows-host defects (#71). Every gate above runs on
  # ubuntu only, so script and test drift specific to the maintainer's host stayed
  # invisible until a local `npm run verify`: a bash-only `prepare`, a canon path
  # comparison, a CRLF registry fixture, 8.3 short paths and a symlink privilege all
  # landed as red on Windows and green on CI. This is an addition, not a replacement:
  # the ubuntu `verify` job still owns all eighteen enforced gates (including the two
  # additive scanners from #98 — internal paths and plan status), and this job runs
  # the ratified subset that exercises the host-sensitive code paths.
  windows:
    name: verify-windows
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Gate manifest
        run: npm run ci:gates

      # The unit suite drives scripts/pre-push-refs.sh through a POSIX shell, and Git
      # for Windows keeps sh.exe in its own bin directory, which a runner shell does not
      # export. Without this the five hook tests skip instead of running.
      - name: Git POSIX shell on PATH
        shell: pwsh
        run: |
          "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Typecheck (tsc)
        run: npm run check:ts

      - name: Typecheck (svelte-check --tsgo)
        run: npm run check

      - name: Unit tests + contrast gate + coverage ratchet (Vitest)
        run: npm run test:unit
