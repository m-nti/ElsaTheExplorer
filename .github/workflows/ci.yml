name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Canon / vocabulary gate
        run: npm run --if-present canon

      - name: Lint (ESLint)
        run: npm run --if-present lint

      - name: Stylelint + selector diff
        run: npm run --if-present stylelint

      - name: Dead code (knip)
        run: npm run --if-present knip

      - name: Typecheck (tsc + svelte-check)
        run: npm run --if-present check

      - name: Unit tests (Vitest)
        run: npm run --if-present test:unit

      - name: Build
        run: npm run --if-present build

      - name: Duplicate code (jscpd)
        run: npx --yes jscpd --config jscpd.json .

      - name: E2E (Playwright)
        run: npm run --if-present test:e2e
