name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fail closed: no `--if-present`, no `|| true`. A gate declared in
      # .github/gates.json must have a script and a step here; a gate that
      # cannot exist yet is declared pending with its issue and printed.
      - name: Install
        run: npm ci

      - name: Gate manifest
        run: npm run ci:gates

      - name: Scaffold presence
        run: |
          missing=""
          for f in index.html src/main.ts vite.config.ts panda.config.ts; do
            [ -e "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::scaffold incomplete — missing:$missing"
            exit 1
          fi

      # Gate order follows ADR-0006: vocabulary first, then typecheck, then
      # styling/lint/dead code, then tests, then the build.
      - name: Canon / vocabulary gate
        run: npm run canon

      - name: Canon gate self-tests
        run: npm run test:canon

      - name: Typecheck (tsc)
        run: npm run check:ts

      - name: Typecheck (svelte-check --tsgo)
        run: npm run check

      - name: Stylelint
        run: npm run stylelint

      - name: Cross-file selector diff
        run: npm run gate:selectors

      - name: Unused CSS (Svelte compiler)
        run: npm run gate:unused-css

      - name: Lint (ESLint)
        run: npm run lint

      - name: Dead code (knip)
        run: npm run knip

      - name: Duplicate code (jscpd, pinned)
        run: npm run jscpd

      - name: Unit tests + contrast gate + coverage ratchet (Vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Pending gate e2e/#24: skipped only while no spec exists, and the skip
      # is declared in .github/gates.json. Once a spec lands, this step runs
      # the full matrix and is fail-closed.
      - name: E2E (Playwright)
        run: |
          if compgen -G "tests/e2e/*.spec.ts" > /dev/null; then
            npx playwright install --with-deps chromium webkit
            npm run test:e2e
          else
            echo "pending gate e2e (#24) — no specs yet"
          fi
