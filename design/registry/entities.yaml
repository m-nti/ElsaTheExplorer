# ─── ITEMS: none, deliberately ──────────────────────────────────────────────
# Cards are per-photo manifest records, not registered items: no card has a
# gold value, a weight or a stack size, and no document names a collectable
# that another document must agree with. An empty list is the check that says
# "looked, none" — a missing section would only say "nobody looked".

items: []

# ─── FORMULAS: none, deliberately ───────────────────────────────────────────
# Every derived number in this product is computed at render time and stored
# nowhere (R-C): wing progress, overall progress, the milestone thresholds.
# They are one-line ratios over the seen-set, defined in the GDD's Formulas
# section, and no second document restates them as a formula with variables.

formulas: []

# ─── CONSTANTS: numbers two documents must agree on ─────────────────────────

constants:
  - name: pack_size
    status: active
    source: design/copy/copy-deck.md
