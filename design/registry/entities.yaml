# Entity Registry — Elsa the Explorer
#
# PURPOSE: the one machine-readable register of every named fact that crosses a
# document boundary — the seven collection sets (slugs, room codes, display
# names, frames), the closed storage-key register, the pack size, and the
# copy-key index. A check or a generator reads this file; the canonical prose
# stays in the document named in `source`.
#
# LAYOUT: the shape `.claude/scripts/registry.sh` reads — one shape, no
# variants, because a checker that guesses is worse than no checker.
#   - a section is a key at column 0 holding a block list, or [] while empty
#   - an entry starts "- name: <value>", the dash at column 2 (column 0 is the
#     other allowed column; one column per section)
#   - an entry's fields sit two columns past the dash; a deeper line belongs to
#     the field above it; a block list under a field may sit at the field's
#     column
#   - a value holding ": " is quoted; a flow list stays on one line; no tabs
#   - `status` is active | deprecated; entries are never deleted, they are
#     deprecated, so a consumer sees the retirement
#   - `source` and every `referenced_by` path must exist on disk
#   An unsupported line is a defect in this file, not in the reader:
#   `tests/unit/registry.test.ts` rejects it with the line number before any
#   assertion runs.
#
# SCOPE — what belongs here, and what does not:
#   - SETS. `entities` holds the closed set of `photos/captions.json` `set`
#     values: the six rooms plus the automatic shelf (GDD R-A). There is no
#     second list of sets anywhere; a photo's `set` is one of these slugs or it
#     lands on the shelf (R-A fallback, `default_for_unassigned`).
#   - STORAGE. `storage_keys` mirrors ADR-0003 §2 exactly. That register is a
#     closed set: a new key needs a line in the ADR first, then a line here.
#   - NUMBERS. `constants` holds only values another document must agree with;
#     `pack_size` is the 4-card canon (copy deck §0.3, stage-landing §"4-card
#     canon 2026-11-22").
#   - COPY KEYS. `copy_keys` is a routing index over the deck, not a copy of it:
#     it lists key names and carries no copy value. The one exception is a set
#     entry's `display_de`/`display_en`/`chip_de`/`chip_en`: a set's name is
#     itself the cross-document fact, so it is registered here and mirrored
#     against deck §6.2 by the gate. The deck remains SSOT for the string, the
#     character budget and the one-exclamation rule (§0.4.4); this index exists
#     so a generator or a reviewer can name a surface's keys without grepping
#     prose. Room lore keys (`room:<slug>:<surface>`) are spec-owned and live on
#     each entity, because the deck does not carry them.
#
# SSOT (who owns a value; this file never outranks it):
#   - set membership + completion rules → design/gdd/collection-meta.md R-A..R-I
#   - room codes and room lore keys     → design/features/archive-fiction.md §2
#   - display names, chips, copy keys   → design/copy/copy-deck.md (§6.2, §1–§10)
#   - storage keys and envelope shape   → docs/adr/ADR-0003-state-persistence.md
#   - pack size                         → copy deck §0.3 + stage-landing canon
#
# PROVISIONAL: every display name carries `name_status: provisional`. The GDD's
# Open Question 2 (wing names final check against the real photos) is open; the
# slugs and codes are stable, the names are cheap to change before launch.

version: 1
last_updated: "2026-11-22"

