      - design/gdd/collection-meta.md
      - design/ux/interaction-patterns.md
      - design/ux/stage-landing.md
      - docs/architecture.md
      - docs/test-plan.md
    value: 4
    unit: cards
    added: 2026-11-22
    revised: ""

# ─── STORAGE KEYS: ADR-0003 §2, the closed set ──────────────────────────────
# Every key is `lucky-elsa.<name>`. `envelope: true` marks a key whose payload
# is wrapped as `{ "v": n, "data": … }` — the keys that once existed in a bare
# v1 form and are migrated at boot (ADR-0003 §1, §4). Keys introduced after
# that migration (`envelope: false`) store a self-describing bare payload. A
# shape change bumps the suffix and adds a migration step; it never
# reinterprets bytes in place. `session.v1` is the one sessionStorage key.

storage_keys:
  - name: lang.v2
    status: active
    source: docs/adr/ADR-0003-state-persistence.md
    referenced_by:
      - design/gdd/collection-meta.md
      - design/ux/stage-landing.md
    storage: localStorage
    version: 2
    envelope: true
    payload: "'de' | 'en'"
    owner: i18n.svelte.ts
    added: 2026-11-22
    revised: ""

  - name: sound.v2
